name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  server:
    uses: ./.github/workflows/server.yml

  android:
    uses: ./.github/workflows/android.yml

  release:
    needs: [server, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AudioPC.exe
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: AudioPC-apk
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AudioPC.exe
            dist/*.apk
          generate_release_notes: true
