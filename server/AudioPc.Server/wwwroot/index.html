<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audio PC</title>
<meta name="description" content="Elige por dónde suena la PC.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f3f5f7" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Audio PC">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #0b0d11;
    --glow: rgba(45, 212, 191, .13);
    --surface: #14181e;
    --surface-2: #1b2028;
    --border: #252b35;
    --border-strong: #343c49;
    --text: #eef1f5;
    --muted: #949dac;
    --faint: #6b7483;
    --accent: #2dd4bf;
    --accent-2: #22b8e6;
    --accent-soft: rgba(45, 212, 191, .14);
    --on-accent: #052622;
    --danger: #ff6b6b;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px -12px rgba(0,0,0,.6);
    --hero-shadow: 0 18px 40px -16px rgba(34, 184, 230, .55);
    --radius: 18px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", system-ui, sans-serif;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f5f7;
      --glow: rgba(13, 148, 136, .10);
      --surface: #ffffff;
      --surface-2: #eef1f4;
      --border: #e1e5eb;
      --border-strong: #cbd2db;
      --text: #10151b;
      --muted: #5a6371;
      --faint: #8a93a1;
      --accent: #0f9e8e;
      --accent-2: #0b86b8;
      --accent-soft: rgba(15, 158, 142, .11);
      --on-accent: #ffffff;
      --danger: #d64545;
      --shadow: 0 1px 2px rgba(16,21,27,.05), 0 8px 24px -14px rgba(16,21,27,.18);
      --hero-shadow: 0 18px 36px -18px rgba(11, 134, 184, .55);
      color-scheme: light;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(120% 60% at 50% -10%, var(--glow), transparent 60%),
      var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font: 400 16px/1.45 var(--font);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  svg.i { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }

  .app {
    max-width: 560px;
    margin: 0 auto;
    padding:
      calc(env(safe-area-inset-top, 0px) + 20px)
      calc(env(safe-area-inset-right, 0px) + 18px)
      calc(env(safe-area-inset-bottom, 0px) + 28px)
      calc(env(safe-area-inset-left, 0px) + 18px);
  }

  /* Cabecera */
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  header .logo { width: 40px; height: 40px; border-radius: 11px; flex: none; box-shadow: 0 6px 16px -8px rgba(34,184,230,.7); }
  header .titles { flex: 1; min-width: 0; }
  header h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; line-height: 1.2; }
  .status { display: flex; align-items: center; gap: 6px; margin-top: 2px; font-size: 13px; color: var(--muted); }
  .status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); transition: background .3s; }
  .status.ok .dot { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .status.err .dot { background: var(--danger); box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 18%, transparent); }
  .icon-btn {
    width: 44px; height: 44px; flex: none;
    display: grid; place-items: center;
    border-radius: 13px; border: 1px solid var(--border);
    background: var(--surface); color: var(--muted);
    cursor: pointer; touch-action: manipulation;
    box-shadow: var(--shadow);
    transition: color .15s, border-color .15s, transform .1s;
  }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 21px; height: 21px; }
  .icon-btn.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Tarjeta "Sonando en" */
  .hero {
    position: relative; overflow: hidden;
    border-radius: 24px;
    padding: 20px 20px 22px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--on-accent);
    box-shadow: var(--hero-shadow);
    margin-bottom: 28px;
    min-height: 148px;
  }
  .hero::after {
    content: ""; position: absolute; inset: auto -40px -70px auto;
    width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.28), transparent 65%);
    pointer-events: none;
  }
  .hero .label {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .78;
  }
  .hero .row { display: flex; align-items: center; gap: 16px; margin-top: 16px; }
  .hero .big-icon {
    width: 60px; height: 60px; flex: none; border-radius: 18px;
    display: grid; place-items: center;
    background: rgba(255,255,255,.22);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  }
  .hero .big-icon svg { width: 32px; height: 32px; stroke-width: 2; }
  .hero .hero-text { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .hero .photo {
    display: none;
    width: 124px; height: 124px; flex: none;
    margin: -14px -8px -8px 0;
    object-fit: contain;
    position: relative; z-index: 1;
    filter: drop-shadow(0 12px 14px rgba(0, 30, 40, .32));
  }
  .hero.has-photo .photo { display: block; }
  .hero.has-photo .big-icon { display: none; }
  .hero .swap { animation: swap .45s cubic-bezier(.2, .9, .3, 1.15); }
  @keyframes swap { from { opacity: 0; transform: translateY(8px) scale(.92); } }
  /* Volumen (de la salida activa) */
  .vol { position: relative; z-index: 1; display: flex; align-items: center; gap: 12px; margin-top: 18px; }
  .hero.empty .vol { display: none; }
  .vol-btn {
    width: 44px; height: 44px; flex: none; border: 0; border-radius: 14px;
    display: grid; place-items: center; cursor: pointer; touch-action: manipulation;
    background: rgba(255, 255, 255, .24); color: inherit;
    transition: background .15s, transform .1s;
  }
  .vol-btn:active { transform: scale(.92); }
  .vol-btn svg { width: 22px; height: 22px; stroke-width: 2.1; }
  .vol-val { width: 44px; flex: none; text-align: right; font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .vol input[type=range] {
    --p: 50%;
    flex: 1; min-width: 0; height: 44px; margin: 0;
    color: inherit; /* los controles de formulario no heredan el color por defecto */
    background: transparent; cursor: pointer; touch-action: pan-y;
    -webkit-appearance: none; appearance: none;
  }
  .vol input[type=range]:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; border-radius: 8px; }
  .vol input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 999px;
    background: linear-gradient(to right, currentColor var(--p), color-mix(in srgb, currentColor 22%, transparent) var(--p));
  }
  .vol input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: color-mix(in srgb, currentColor 22%, transparent); }
  .vol input[type=range]::-moz-range-progress { height: 10px; border-radius: 999px; background: currentColor; }
  .vol input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 26px; height: 26px; margin-top: -8px; border-radius: 50%;
    background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
    transition: transform .12s;
  }
  .vol input[type=range]:active::-webkit-slider-thumb { transform: scale(1.12); }
  .vol input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 2px 8px rgba(0, 0, 0, .3); }
  .vol.muted input[type=range], .vol.muted .vol-val { opacity: .45; }
  .vol.muted .vol-btn { background: var(--on-accent); color: var(--accent); }

  .hero .name { font-size: 22px; font-weight: 750; letter-spacing: -.015em; line-height: 1.18; overflow-wrap: anywhere; }
  .hero .kind { font-size: 14px; font-weight: 500; opacity: .8; margin-top: 3px; overflow-wrap: anywhere; }
  .hero.empty .name { opacity: .85; }

  /* Ecualizador animado */
  .eq { display: flex; align-items: flex-end; gap: 3px; height: 16px; }
  .eq i { display: block; width: 3px; height: 100%; border-radius: 2px; background: currentColor; transform-origin: bottom; animation: eq 1s ease-in-out infinite; }
  .eq i:nth-child(2) { animation-delay: -.45s; animation-duration: .85s; }
  .eq i:nth-child(3) { animation-delay: -.2s;  animation-duration: 1.15s; }
  .eq i:nth-child(4) { animation-delay: -.7s;  animation-duration: .95s; }
  @keyframes eq { 0%, 100% { transform: scaleY(.25); } 50% { transform: scaleY(1); } }
  .hero.empty .eq { visibility: hidden; }

  /* Lista de dispositivos */
  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 0 4px 12px; }
  .section-title h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .section-title span { font-size: 13px; color: var(--faint); }

  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .dev {
    position: relative;
    display: flex; align-items: center; gap: 14px;
    width: 100%; min-height: 76px;
    padding: 14px 16px 14px 14px;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    cursor: pointer;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    transition: border-color .2s, background .2s, transform .12s;
  }
  .dev:active { transform: scale(.985); }
  .dev:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .dev .chip {
    width: 46px; height: 46px; flex: none; border-radius: 14px;
    display: grid; place-items: center;
    background: var(--surface-2); color: var(--muted);
    transition: background .2s, color .2s;
  }
  /* Foto del equipo: baldosa clara en ambos temas (los equipos negros se pierden sobre oscuro) */
  .dev .thumb {
    width: 62px; height: 62px; flex: none; border-radius: 15px;
    margin: -4px 0 -4px -2px;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 30%, #ffffff, #dde2e9 78%);
    box-shadow: inset 0 0 0 1px rgba(16, 21, 27, .06);
    overflow: hidden;
  }
  .dev .thumb img { width: 86%; height: 86%; object-fit: contain; filter: drop-shadow(0 4px 5px rgba(16, 21, 27, .22)); }
  @media (prefers-color-scheme: dark) {
    .dev .thumb { background: radial-gradient(circle at 50% 30%, #f4f6f9, #c9d0da 80%); }
  }
  .dev.active .thumb { box-shadow: 0 0 0 2px var(--accent); }
  .dev .text { flex: 1; min-width: 0; }
  .dev .title {
    font-size: 16.5px; font-weight: 650; line-height: 1.25; letter-spacing: -.005em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere;
  }
  .dev .sub { display: block; font-size: 13.5px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dev .mark {
    width: 26px; height: 26px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    border: 2px solid var(--border-strong);
    transition: background .2s, border-color .2s;
  }
  .dev .mark svg { width: 15px; height: 15px; stroke-width: 3; opacity: 0; transform: scale(.6); transition: opacity .2s, transform .2s; }

  .dev.active { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: linear-gradient(var(--accent-soft), var(--accent-soft)), var(--surface); }
  .dev.active .chip { background: var(--accent); color: var(--on-accent); }
  .dev.active .mark { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .dev.active .mark svg { opacity: 1; transform: none; }

  .dev.busy .mark { border-color: var(--accent); border-top-color: transparent; animation: spin .7s linear infinite; }
  .list.locked .dev:not(.busy) { opacity: .55; pointer-events: none; }

  /* Esqueleto de carga */
  .skel { height: 76px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); position: relative; overflow: hidden; }
  .skel::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 6%, transparent), transparent);
    transform: translateX(-100%); animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }

  /* Error de conexión */
  .error {
    display: none;
    padding: 18px; border-radius: var(--radius);
    border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
    background: color-mix(in srgb, var(--danger) 9%, var(--surface));
    margin-bottom: 14px;
  }
  .error.show { display: block; }
  .error strong { display: block; font-size: 15.5px; margin-bottom: 4px; }
  .error p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .error button {
    min-height: 44px; padding: 0 18px; border-radius: 12px; border: 0;
    background: var(--text); color: var(--bg); font-weight: 650; cursor: pointer;
  }

  .install-btn {
    display: none; align-items: center; gap: 6px;
    height: 44px; padding: 0 14px; flex: none;
    border-radius: 13px; border: 0;
    background: var(--accent); color: var(--on-accent);
    font-size: 14.5px; font-weight: 700; cursor: pointer; touch-action: manipulation;
  }
  .install-btn.show { display: inline-flex; }
  .install-btn svg { width: 18px; height: 18px; stroke-width: 2.4; }

  footer { margin-top: 22px; text-align: center; font-size: 12.5px; color: var(--faint); }
  /* Aviso flotante */
  .toast {
    position: fixed; left: 50%; z-index: 10;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    transform: translate(-50%, 20px);
    max-width: calc(100% - 32px);
    display: flex; align-items: center; gap: 10px;
    padding: 12px 18px; border-radius: 999px;
    background: var(--text); color: var(--bg);
    font-size: 14.5px; font-weight: 600;
    box-shadow: 0 12px 30px -10px rgba(0,0,0,.5);
    opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .25s cubic-bezier(.2,.9,.3,1.2);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast svg { width: 18px; height: 18px; stroke-width: 2.6; }
  .toast.err { background: var(--danger); color: #fff; }

  @media (min-width: 720px) {
    .app { padding-top: 48px; }
  }
  @media (hover: hover) {
    .dev:hover { border-color: var(--border-strong); }
    .dev.active:hover { border-color: color-mix(in srgb, var(--accent) 70%, transparent); }
    .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; transition-duration: 0s !important; }
    .eq i { transform: scaleY(.6); }
  }

  [hidden] { display: none !important; }
  .status.warn .dot { background: #f5b942; box-shadow: 0 0 0 3px rgba(245,185,66,.18); }

  /* Emparejamiento */
  .pair {
    padding: 24px 20px 22px; border-radius: 24px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
    text-align: center;
  }
  .pair h2 { margin: 0 0 6px; font-size: 20px; font-weight: 750; letter-spacing: -.01em; line-height: 1.25; }
  .pair p { margin: 0; color: var(--muted); font-size: 14.5px; }
  .code-input {
    display: block; width: 100%; max-width: 100%; margin: 22px 0 8px;
    height: 72px; padding: 0 0 0 .42em;
    text-align: center; font: 700 clamp(28px, 11vw, 38px)/1 ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
    letter-spacing: .36em; font-variant-numeric: tabular-nums;
    color: var(--text); background: var(--surface-2);
    border: 2px solid var(--border-strong); border-radius: 18px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .code-input::placeholder { color: var(--faint); opacity: .6; }
  .code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .code-input.bad { border-color: var(--danger); animation: shake .4s; }
  .code-input:disabled { opacity: .6; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  .pair-msg { min-height: 22px; font-size: 14px; color: var(--muted); }
  .pair-msg.err { color: var(--danger); font-weight: 600; }
  .pair .pair-hint { margin-top: 4px; font-size: 13px; line-height: 1.4; }
  .btn {
    min-height: 44px; margin-top: 12px; padding: 0 20px; border-radius: 12px; border: 0;
    background: var(--text); color: var(--bg); font-weight: 650; cursor: pointer; touch-action: manipulation;
  }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border-strong); }
  .btn:focus-visible, .link-btn:focus-visible, .foot-link:focus-visible, .error button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: .55; cursor: default; }

  .foot-links { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 0 18px; margin-top: 4px; }
  .foot-link, .link-btn {
    display: inline-flex; align-items: center; min-height: 44px; padding: 0 2px;
    background: none; border: 0; cursor: pointer;
    color: var(--muted); font-size: 13.5px; font-weight: 600; text-decoration: none;
  }
  .foot-link { background: linear-gradient(var(--border-strong), var(--border-strong)) 0 calc(50% + 11px) / 100% 1px no-repeat; }
  @media (hover: hover) { .foot-link:hover, .link-btn:hover { color: var(--text); } }
</style>
</head>

<div class="toast" id="toast" aria-live="assertive"><svg class="i"><use id="toast-icon" href="#i-check"/></svg><span id="toast-text"></span></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

// ---- Idiomas ----
const T = {
  es: {
    connecting: 'Conectando…', online: 'PC conectada', reconnecting: 'Reconectando…', offline: 'Sin conexión',
    pairing: 'Sin emparejar', install: 'Instalar', refresh: 'Actualizar',
    pairTitle: 'Escribe el código que aparece en la PC',
    pairConnecting: 'Conectando con la PC…', pairIdle: 'Este navegador no está emparejado', pairStart: 'Emparejar',
    pairHint: 'El código aparece en la notificación de la PC o con clic derecho en el ícono de Audio PC junto al reloj.',
    pairSub: (s) => 'El código vence en ' + s + ' s.',
    pairExpired: 'El código venció.', pairNew: 'Pedir otro código', codeLabel: 'Código de 6 dígitos',
    pairBad: 'Código incorrecto. Inténtalo de nuevo.', pairExpiredMsg: 'El código venció. Pide otro.',
    pairLocked: 'Demasiados intentos. Te pedimos un código nuevo.', pairFail: 'No se pudo hablar con la PC.',
    playingOn: 'Sonando en', searching: 'Buscando…', noActive: 'Ninguna salida activa',
    outputs: 'Salidas', outputsLabel: 'Salida de audio', volume: 'Volumen', mute: 'Silenciar', unmute: 'Quitar silencio',
    available: (n) => n + (n === 1 ? ' disponible' : ' disponibles'), none: 'No hay salidas de audio disponibles.',
    errTitle: 'No se pudo hablar con la PC', errHint: 'Revisa que esté encendida y en la misma red Wi-Fi.',
    timeout: 'La PC no respondió a tiempo.', retry: 'Reintentar',
    already: 'Ya está sonando ahí', playingToast: (n) => 'Sonando en ' + n,
    gone: 'Esa salida ya no está conectada', switchFail: (e) => 'No se pudo cambiar: ' + e,
    volFail: (e) => 'No se pudo cambiar el volumen: ' + e,
    muteFail: (on, e) => 'No se pudo ' + (on ? 'silenciar' : 'quitar el silencio') + ': ' + e,
    updNow: 'Actualizado ahora', updS: (s) => 'Actualizado hace ' + s + ' s', updM: (m) => 'Actualizado hace ' + m + ' min',
    android: 'App para Android', unpair: 'Desvincular este navegador', installed: 'App instalada',
    dev: (b, o) => 'Navegador · ' + b + ' en ' + o, errCode: (c) => 'Error ' + c,
  },
  en: {
    connecting: 'Connecting…', online: 'PC connected', reconnecting: 'Reconnecting…', offline: 'No connection',
    pairing: 'Not paired', install: 'Install', refresh: 'Refresh',
    pairTitle: 'Enter the code shown on the PC',
    pairConnecting: 'Connecting to the PC…', pairIdle: 'This browser is not paired', pairStart: 'Pair',
    pairHint: 'The code shows in the PC notification, or right-click the Audio PC icon next to the clock.',
    pairSub: (s) => 'The code expires in ' + s + ' s.',
    pairExpired: 'The code expired.', pairNew: 'Request a new code', codeLabel: '6-digit code',
    pairBad: 'Wrong code. Try again.', pairExpiredMsg: 'The code expired. Request a new one.',
    pairLocked: 'Too many attempts. Requesting a new code.', pairFail: 'Could not reach the PC.',
    playingOn: 'Playing on', searching: 'Looking…', noActive: 'No active output',
    outputs: 'Outputs', outputsLabel: 'Audio output', volume: 'Volume', mute: 'Mute', unmute: 'Unmute',
    available: (n) => n + ' available', none: 'No audio outputs available.',
    errTitle: 'Could not reach the PC', errHint: 'Make sure it is on and on the same Wi-Fi network.',
    timeout: 'The PC did not respond in time.', retry: 'Retry',
    already: 'Already playing there', playingToast: (n) => 'Playing on ' + n,
    gone: 'That output is no longer connected', switchFail: (e) => 'Could not switch: ' + e,
    volFail: (e) => 'Could not change the volume: ' + e,
    muteFail: (on, e) => 'Could not ' + (on ? 'mute' : 'unmute') + ': ' + e,
    updNow: 'Updated just now', updS: (s) => 'Updated ' + s + ' s ago', updM: (m) => 'Updated ' + m + ' min ago',
    android: 'Android app', unpair: 'Unpair this browser', installed: 'App installed',
    dev: (b, o) => 'Browser · ' + b + ' on ' + o, errCode: (c) => 'Error ' + c,
  },
};
const lang = /^es/i.test(navigator.language || '') ? 'es' : 'en';
const L = T[lang];
document.documentElement.lang = lang;
document.title = 'Audio PC';
document.querySelector('meta[name=description]').content = lang === 'es' ? 'Elige por dónde suena la PC.' : 'Choose where your PC plays sound.';
for (const n of document.querySelectorAll('[data-t]')) n.textContent = L[n.dataset.t];
for (const n of document.querySelectorAll('[data-label]')) n.setAttribute('aria-label', L[n.dataset.label]);

// ---- Almacenamiento (puede fallar en modo privado) ----
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* sin almacenamiento */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* nada */ } },
};
const uuid = () => (crypto.randomUUID ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => { const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }));
let deviceId = store.get('audiopc.deviceId');
if (!deviceId) { deviceId = uuid(); store.set('audiopc.deviceId', deviceId); }
let auth = null;
try { auth = JSON.parse(store.get('audiopc.auth') || 'null'); } catch { auth = null; }
if (!auth || !auth.token) auth = null;

function deviceName() {
  const ua = navigator.userAgent || '';
  const browser = /SamsungBrowser/i.test(ua) ? 'Samsung Internet' : /Edg\//.test(ua) ? 'Edge' : /OPR\/|Opera/.test(ua) ? 'Opera'
    : /Firefox|FxiOS/.test(ua) ? 'Firefox' : /Chrome|CriOS/.test(ua) ? 'Chrome' : /Safari/.test(ua) ? 'Safari' : (lang === 'es' ? 'navegador' : 'browser');
  const os = /Android/.test(ua) ? 'Android' : /iPhone|iPad|iPod/.test(ua) ? 'iOS' : /Windows/.test(ua) ? 'Windows'
    : /Mac OS X|Macintosh/.test(ua) ? 'macOS' : /CrOS/.test(ua) ? 'ChromeOS' : /Linux/.test(ua) ? 'Linux' : (lang === 'es' ? 'otro sistema' : 'unknown OS');
  return L.dev(browser, os);
}

// ---- Utilidades de interfaz ----
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
const KINDS = ['speaker', 'headphones', 'headset', 'earbuds', 'tv', 'virtual'];
function icon(name) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'i');
  const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
  use.setAttribute('href', '#i-' + name);
  svg.appendChild(use);
  return svg;
}
const kindIcon = (k) => (KINDS.includes(k) ? k : 'speaker');

let toastTimer;
function toast(text, err) {
  $('toast-text').textContent = text;
  $('toast-icon').setAttribute('href', err ? '#i-alert' : '#i-check');
  $('toast').classList.toggle('err', !!err);
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), err ? 3200 : 1800);
}
function setStatus(cls, key) {
  $('status').className = 'status ' + cls;
  $('status-text').textContent = L[key];
}

// ---- API ----
class ApiError extends Error { constructor(msg, status, code) { super(msg); this.status = status; this.code = code; } }

async function http(path, opts = {}, authed = true) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const headers = { ...(opts.body ? { 'Content-Type': 'application/json' } : {}) };
    if (authed && auth) headers.Authorization = 'Bearer ' + auth.token;
    const r = await fetch(path, { ...opts, headers, signal: ctrl.signal, cache: 'no-store' });
    const body = await r.json().catch(() => ({}));
    if (r.status === 401 && authed) { unpair(); throw new ApiError('unauthorized', 401, 'unauthorized'); }
    if (!r.ok) throw new ApiError(body.message || body.error || L.errCode(r.status), r.status, body.error);
    return body;
  } catch (e) {
    if (e instanceof ApiError) throw e;
    if (e.name === 'AbortError') throw new ApiError(L.timeout, 0, 'timeout');
    throw new ApiError(L.errHint, 0, 'network');
  } finally {
    clearTimeout(t);
  }
}
const post = (path, data) => http(path, { method: 'POST', body: JSON.stringify(data) });

// ---- Emparejamiento ----
const pairing = { requestId: null, timer: null, left: 0, busy: false, gen: 0 };

function pairMsg(text, err) { $('pair-msg').textContent = text || ''; $('pair-msg').classList.toggle('err', !!err); }

// The code UI only appears when the PC asks for a code: with open pairing (the default) the
// request itself returns the token, so "enter the code" must not flash first.
// mode: 'requesting' | 'code' | 'idle' (explicitly unpaired) | 'error'
function pairMode(mode) {
  const code = mode === 'code';
  $('code').hidden = !code; $('pair-hint').hidden = !code;
  $('pair-title').textContent = code ? L.pairTitle : mode === 'idle' ? L.pairIdle : L.pairConnecting;
  $('pair-new').textContent = code ? L.pairNew : mode === 'idle' ? L.pairStart : L.retry;
  $('pair-new').hidden = mode === 'requesting';
}

// auto=false after "Unpair this browser": with open pairing an automatic request would pair
// the browser again at once, so wait for the user to ask.
function showPairing(auto = true) {
  stopLive();
  $('main-view').hidden = true; $('pair-view').hidden = false;
  $('refresh').hidden = true; $('unpair').hidden = true; $('updated').textContent = '';
  $('install').classList.remove('show');
  setStatus('', 'pairing');
  if (auto) requestCode();
  else {
    pairing.gen++; clearInterval(pairing.timer); pairing.requestId = null;
    $('pair-sub').textContent = ''; pairMsg('');
    pairMode('idle');
  }
}

function finishPairing(r) {
  clearInterval(pairing.timer); pairing.gen++; pairing.requestId = null;
  auth = { token: r.token, serverId: r.serverId };
  store.set('audiopc.auth', JSON.stringify(auth));
  startMain();
}

async function requestCode() {
  const gen = ++pairing.gen;
  clearInterval(pairing.timer);
  pairing.requestId = null; pairing.left = 0;
  $('code').value = ''; $('code').disabled = true; $('code').classList.remove('bad');
  $('pair-sub').textContent = '';
  pairMode('requesting');
  pairMsg('');
  try {
    const r = await http('/api/pair/request', { method: 'POST', body: JSON.stringify({ deviceName: deviceName(), deviceId }) }, false);
    if (gen !== pairing.gen) return;
    // Open pairing: the response already carries the token (same shape as /api/pair/confirm).
    if (r.token) { finishPairing(r); return; }
    pairMode('code');
    pairing.requestId = r.requestId;
    pairing.left = Number(r.expiresIn) || 120;
    $('code').disabled = false;
    $('code').focus({ preventScroll: true });
    $('pair-sub').textContent = L.pairSub(pairing.left);
    pairing.timer = setInterval(() => {
      pairing.left--;
      if (pairing.left <= 0) {
        clearInterval(pairing.timer);
        pairing.requestId = null;
        $('code').disabled = true;
        $('pair-sub').textContent = L.pairExpired;
        pairMsg(L.pairExpiredMsg, true);
      } else $('pair-sub').textContent = L.pairSub(pairing.left);
    }, 1000);
  } catch (e) {
    if (gen !== pairing.gen) return;
    $('pair-sub').textContent = '';
    pairMode('error');
    pairMsg(e.message || L.pairFail, true);
  }
}

async function confirmCode(code) {
  if (pairing.busy || !pairing.requestId) return;
  pairing.busy = true; $('code').disabled = true;
  try {
    const r = await http('/api/pair/confirm', { method: 'POST', body: JSON.stringify({ requestId: pairing.requestId, code }) }, false);
    finishPairing(r);
  } catch (e) {
    $('code').disabled = false;
    if (e.status === 403) {
      $('code').classList.remove('bad'); void $('code').offsetWidth; $('code').classList.add('bad');
      pairMsg(L.pairBad, true);
      $('code').value = '';
      $('code').focus({ preventScroll: true });
    } else if (e.status === 410) {
      clearInterval(pairing.timer); pairing.requestId = null; $('code').disabled = true;
      $('pair-sub').textContent = L.pairExpired;
      pairMsg(L.pairExpiredMsg, true);
    } else if (e.status === 423) {
      // If the new request is refused too (global lock), keep the server's explanation visible.
      requestCode().then(() => { if (pairing.requestId) pairMsg(L.pairLocked, true); });
    } else {
      pairMsg(e.message || L.pairFail, true);
    }
  } finally {
    pairing.busy = false;
  }
}

$('code').addEventListener('input', (e) => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (v !== e.target.value) e.target.value = v;
  e.target.classList.remove('bad');
  if (v.length > 0 && $('pair-msg').classList.contains('err') && pairing.requestId) pairMsg('');
  if (v.length === 6) confirmCode(v);
});
$('pair-new').addEventListener('click', () => requestCode());

function unpair(auto = true) {
  auth = null; store.del('audiopc.auth');
  state = null; outputs = [];
  showPairing(auto);
}
$('unpair').addEventListener('click', () => unpair(false));

// ---- Estado ----
let state = null;     // último estado recibido
let outputs = [];
let busy = false;
let lastOk = 0;

function renderHero() {
  const hero = $('hero');
  const cur = state && (outputs.find((d) => d.id === state.currentId) || outputs.find((d) => d.isDefault));
  hero.classList.toggle('empty', !cur);
  if (!cur) {
    $('hero-name').textContent = state ? L.noActive : L.searching;
    $('hero-kind').innerHTML = '&nbsp;';
    hero.classList.remove('has-photo');
    return;
  }
  const changed = hero.dataset.id !== cur.id;
  hero.dataset.id = cur.id;
  $('hero-name').textContent = cur.name;
  $('hero-kind').textContent = cur.detail || '';
  $('hero-icon').setAttribute('href', '#i-' + kindIcon(cur.kind));
  const photo = $('hero-photo');
  hero.classList.toggle('has-photo', !!cur.image);
  if (cur.image) {
    photo.onerror = () => hero.classList.remove('has-photo');
    if (photo.getAttribute('src') !== cur.image) photo.src = cur.image;
  }
  if (changed) {
    for (const n of [photo, hero.querySelector('.big-icon'), hero.querySelector('.hero-text')]) {
      n.classList.remove('swap'); void n.offsetWidth; n.classList.add('swap');
    }
  }
}

function renderList() {
  const list = $('list');
  list.replaceChildren();
  const visible = outputs.filter((d) => !d.hidden);
  for (const dev of visible) {
    const active = dev.id === state.currentId;
    const b = el('button', 'dev' + (active ? ' active' : ''));
    b.type = 'button';
    b.setAttribute('role', 'radio');
    b.setAttribute('aria-checked', String(active));
    b.title = dev.rawName || dev.name;
    b.dataset.id = dev.id;
    const chip = el('span', 'chip'); chip.appendChild(icon(kindIcon(dev.kind)));
    let media = chip;
    if (dev.image) {
      media = el('span', 'thumb');
      const img = el('img');
      img.src = dev.image; img.alt = ''; img.decoding = 'async';
      img.onerror = () => media.replaceWith(chip);
      media.appendChild(img);
    }
    const text = el('span', 'text');
    text.append(el('span', 'title', dev.name), el('span', 'sub', dev.detail || ''));
    const mark = el('span', 'mark'); mark.appendChild(icon('check'));
    b.append(media, text, mark);
    b.addEventListener('click', () => choose(dev, b));
    list.appendChild(b);
  }
  if (!visible.length) list.appendChild(el('div', 'sub', L.none));
  $('count').textContent = visible.length ? L.available(visible.length) : '';
}

// Solo repinta lo que cambió, para que el refresco automático no parpadee.
let lastListSig = '';
function applyState(s) {
  if (!s || !Array.isArray(s.outputs)) return;
  state = s;
  outputs = s.outputs;
  const sig = JSON.stringify([s.currentId, outputs]);
  const needList = sig !== lastListSig || !$('list').querySelector('.dev');
  if (needList && !busy) { lastListSig = sig; renderHero(); renderList(); }
  else if (needList) { lastListSig = ''; renderHero(); }
  applyVolume(s);
  $('error').classList.remove('show');
  lastOk = Date.now();
  tick();
}

function showError(msg) {
  $('error-text').textContent = msg;
  $('error').classList.add('show');
  setStatus('err', 'offline');
}

// ---- Volumen de la salida activa ----
const vol = { level: null, muted: false, touchedAt: 0, inflight: false, pending: null };

function paintVolume() {
  if (vol.level == null) return;
  const range = $('vol-range');
  range.value = vol.level;
  range.style.setProperty('--p', vol.level + '%');
  $('vol-val').textContent = vol.level + '%';
  $('vol').classList.toggle('muted', vol.muted);
  $('mute').setAttribute('aria-pressed', String(vol.muted));
  $('mute').setAttribute('aria-label', vol.muted ? L.unmute : L.mute);
  $('mute-icon').setAttribute('href', vol.muted || vol.level === 0 ? '#i-mute' : vol.level < 50 ? '#i-vol-low' : '#i-vol');
}

// Lo que llega solo (refresco o WebSocket) no pisa la barra mientras se mueve ni justo después.
function applyVolume(data) {
  if (typeof data.volume !== 'number') return;
  if (vol.inflight || vol.pending != null || Date.now() - vol.touchedAt < 2000) return;
  vol.level = data.volume;
  vol.muted = !!data.muted;
  paintVolume();
}

// Una orden a la vez: mientras una viaja, se guarda solo el último valor de la barra.
async function sendVolume() {
  if (vol.inflight || vol.pending == null) return;
  const level = vol.pending;
  vol.pending = null;
  vol.inflight = true;
  try {
    const r = await post('/api/volume', { level });
    if (vol.pending == null) { vol.level = r.volume; vol.muted = r.muted; paintVolume(); }
  } catch (e) {
    if (e.status !== 401) toast(L.volFail(e.message), true);
  } finally {
    vol.inflight = false;
    vol.touchedAt = Date.now();
    sendVolume();
  }
}

$('vol-range').addEventListener('input', (e) => {
  vol.level = Number(e.target.value);
  vol.muted = false; // mover el volumen quita el silencio, como en Windows
  vol.touchedAt = Date.now();
  vol.pending = vol.level;
  paintVolume();
  sendVolume();
});

$('mute').addEventListener('click', async () => {
  const want = !vol.muted;
  vol.muted = want;
  vol.touchedAt = Date.now();
  paintVolume();
  if (navigator.vibrate) navigator.vibrate(8);
  try {
    const r = await post('/api/mute', { state: want ? 'on' : 'off' });
    vol.level = r.volume;
    vol.muted = r.muted;
    paintVolume();
  } catch (e) {
    vol.muted = !want;
    paintVolume();
    if (e.status !== 401) toast(L.muteFail(want, e.message), true);
  } finally {
    vol.touchedAt = Date.now();
  }
});

async function load({ quiet } = {}) {
  if (!auth || busy) return;
  const btn = $('refresh');
  if (!quiet) btn.classList.add('spin');
  try {
    applyState(await http('/api/state'));
    if (live.open) setStatus('ok', 'online');
    else setStatus('warn', 'reconnecting');
  } catch (e) {
    if (e.status === 401) return;
    showError(e.message);
    if (!outputs.length) { $('list').replaceChildren(); $('count').textContent = ''; }
  } finally {
    btn.classList.remove('spin');
  }
}

async function choose(dev, btn) {
  const active = state && dev.id === state.currentId;
  if (busy || active) {
    if (active) toast(L.already);
    return;
  }
  busy = true;
  btn.classList.add('busy');
  $('list').classList.add('locked');
  if (navigator.vibrate) navigator.vibrate(8);
  try {
    const s = await post('/api/output', { id: dev.id });
    busy = false;
    applyState(s);
    toast(L.playingToast(dev.name));
  } catch (e) {
    btn.classList.remove('busy');
    if (e.status === 404) toast(L.gone, true);
    else if (e.status !== 401) toast(L.switchFail(e.message), true);
  } finally {
    busy = false;
    $('list').classList.remove('locked');
    load({ quiet: true });
  }
}

function tick() {
  if (!lastOk) return;
  const s = Math.round((Date.now() - lastOk) / 1000);
  $('updated').textContent = s < 5 ? L.updNow : s < 60 ? L.updS(s) : L.updM(Math.round(s / 60));
}

// ---- Tiempo real: WebSocket con reintentos y sondeo mientras está caído ----
const live = { ws: null, open: false, attempt: 0, retryTimer: null, pollTimer: null, stopped: true };
const BACKOFF = [1000, 2000, 5000, 10000];

function connectWs() {
  if (live.stopped || !auth || live.ws) return;
  let ws;
  try {
    ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/api/events?token=' + encodeURIComponent(auth.token));
  } catch { scheduleRetry(); return; }
  live.ws = ws;
  ws.onopen = () => {
    live.open = true; live.attempt = 0;
    clearInterval(live.pollTimer); live.pollTimer = null;
    setStatus('ok', 'online');
    $('error').classList.remove('show');
  };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m && m.type === 'state' && m.state) applyState(m.state);
  };
  ws.onclose = () => {
    if (live.ws !== ws) return;
    live.ws = null; live.open = false;
    if (live.stopped) return;
    setStatus('warn', 'reconnecting');
    if (!live.pollTimer) live.pollTimer = setInterval(() => { if (!document.hidden) load({ quiet: true }); }, 15000);
    scheduleRetry();
  };
  ws.onerror = () => { try { ws.close(); } catch { /* ya cerrado */ } };
}
function scheduleRetry() {
  clearTimeout(live.retryTimer);
  const wait = BACKOFF[Math.min(live.attempt++, BACKOFF.length - 1)];
  live.retryTimer = setTimeout(() => { live.retryTimer = null; connectWs(); }, wait);
}
function startLive() {
  live.stopped = false;
  if (!live.pollTimer) live.pollTimer = setInterval(() => { if (!document.hidden && !live.open) load({ quiet: true }); }, 15000);
  connectWs();
}
function stopLive() {
  live.stopped = true;
  clearTimeout(live.retryTimer); live.retryTimer = null;
  clearInterval(live.pollTimer); live.pollTimer = null;
  const ws = live.ws; live.ws = null; live.open = false;
  if (ws) { ws.onclose = null; try { ws.close(); } catch { /* nada */ } }
}

function startMain() {
  $('pair-view').hidden = true; $('main-view').hidden = false;
  $('refresh').hidden = false; $('unpair').hidden = false;
  setStatus('', 'connecting');
  renderHero();
  load();
  startLive();
}

$('refresh').addEventListener('click', () => load());
$('retry').addEventListener('click', () => { load(); if (!live.ws && !live.stopped) { clearTimeout(live.retryTimer); connectWs(); } });
// Al volver a la pestaña el audio pudo cambiar desde la PC: se refresca y se reconecta sin esperar.
document.addEventListener('visibilitychange', () => {
  if (document.hidden || !auth) return;
  load({ quiet: true });
  if (!live.ws && !live.stopped) { clearTimeout(live.retryTimer); live.attempt = 0; connectWs(); }
});
setInterval(tick, 5000);

// ---- Instalación como app (PWA) ----
// Un service worker viejo de este origen dejaría cachés rancias: se da de baja.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {});
  if (window.caches) caches.keys().then((ks) => ks.forEach((k) => caches.delete(k))).catch(() => {});
}
let installEvt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  installEvt = e;
  if (auth) $('install').classList.add('show');
});
$('install').addEventListener('click', async () => {
  if (!installEvt) return;
  installEvt.prompt();
  await installEvt.userChoice.catch(() => {});
  installEvt = null;
  $('install').classList.remove('show');
});
window.addEventListener('appinstalled', () => { $('install').classList.remove('show'); toast(L.installed); });

// ---- Arranque ----
setStatus('', 'connecting');
if (auth) startMain(); else showPairing();
</script>
</body>
